name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: full verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: Install verification tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r1s-tools"
          curl --fail --location --retry 3 https://github.com/protocolbuffers/protobuf/releases/download/v36.0/protoc-36.0-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          echo "bc8211ce760bd43ee21ddc145d6d9dbaeeabae205267a79d9054a240e367d4b4  $RUNNER_TEMP/protoc.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/r1s-tools"
          curl --fail --location --retry 3 https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/lychee.tar.gz"
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/r1s-tools/bin" lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP/r1s-tools/bin" >> "$GITHUB_PATH"

      - run: make check

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # Proves every released platform still compiles, without publishing.
      - run: scripts/build-release.sh "ci-${{ github.sha }}"
