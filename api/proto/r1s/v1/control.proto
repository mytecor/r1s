syntax = "proto3";

package r1s.v1;

option go_package = "github.com/mytecor/r1s/api/gen/r1s/v1;r1sv1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Envelope is the authenticated unit exchanged by transports. Transports MUST
// replace sender with the identity authenticated for the connection.
message Envelope {
  string message_id = 1;
  bytes sender = 2;
  string correlation_id = 3;
  google.protobuf.Timestamp sent_at = 4;

  reserved 5 to 9;

  oneof payload {
    ExecutionRequest execution_request = 10;
    ExecutionOffer execution_offer = 11;
    ExecutionAssign execution_assign = 12;
    ExecutionCancel execution_cancel = 13;
    ExecutionState execution_state = 14;
    ExecutionInspect execution_inspect = 15;
    ExecutionOfferRelease execution_offer_release = 16;
    ExecutionOfferReleaseAck execution_offer_release_ack = 17;
    CommandError command_error = 18;
    ExecutionLogsRequest execution_logs_request = 19;
    ExecutionLogsResponse execution_logs_response = 20;
    ExecutionLeaseRenew execution_lease_renew = 21;
    ExecutionLeaseRenewAck execution_lease_renew_ack = 22;
    ExecutionTunnelGrant execution_tunnel_grant = 23;
    ExecutionTunnelGrantAck execution_tunnel_grant_ack = 24;
  }
}

// Workload describes an OCI workload without exposing a concrete runtime API.
message Workload {
  string image = 1;
  repeated string command = 2;
  repeated string args = 3;
  map<string, string> environment = 4;
  string working_directory = 5;
}

// ExecutionPolicy bounds an execution independently of network connectivity.
// Lifetime is bounded by a durable, explicitly renewed client-held lease
// (see ExecutionLeaseRenew), never by a request-time deadline: `deadline` and
// `max_runtime` are retired and their field numbers are reserved, never reused.
// `result_retention` is unchanged.
message ExecutionPolicy {
  reserved 1, 2;
  reserved "deadline", "max_runtime";

  google.protobuf.Duration result_retention = 3;
}

message ExecutionRequest {
  string request_id = 1;
  Workload workload = 2;
  ExecutionPolicy policy = 3;
  string resource_class = 4;
}

message ExecutionOffer {
  string offer_id = 1;
  string request_id = 2;
  string resource_class = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message ExecutionAssign {
  string request_id = 1;
  string offer_id = 2;
  string execution_id = 3;
}

// Release only gives back a reservation owned by the authenticated client.
// It never cancels an assigned execution.
message ExecutionOfferRelease {
  string request_id = 1;
  string offer_id = 2;
}

message ExecutionOfferReleaseAck {
  string request_id = 1;
  string offer_id = 2;
  OfferReleaseOutcome outcome = 3;
}

enum OfferReleaseOutcome {
  OFFER_RELEASE_OUTCOME_UNSPECIFIED = 0;
  OFFER_RELEASE_OUTCOME_RELEASED = 1;
  OFFER_RELEASE_OUTCOME_EXPIRED = 2;
  OFFER_RELEASE_OUTCOME_ASSIGNED = 3;
}

message ExecutionCancel {
  string execution_id = 1;
  string reason = 2;
}

// ExecutionInspect asks the selected allocator for its latest durable state.
// It is safe to repeat after either participant restarts.
message ExecutionInspect {
  string execution_id = 1;
}

enum ExecutionPhase {
  EXECUTION_PHASE_UNSPECIFIED = 0;
  EXECUTION_PHASE_STARTING = 1;
  EXECUTION_PHASE_RUNNING = 2;
  EXECUTION_PHASE_CANCELLING = 3;
  EXECUTION_PHASE_CANCELLED = 4;
  EXECUTION_PHASE_COMPLETED = 5;
  EXECUTION_PHASE_FAILED = 6;
}

message ExecutionState {
  string execution_id = 1;
  ExecutionPhase phase = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string detail = 4;
  optional int32 exit_code = 5;
  // Zero denotes a legacy peer; positive revisions order durable transitions.
  uint64 revision = 6;
}

// Errors contain bounded service diagnostics, never workload output.
message CommandError {
  string code = 1;
  string detail = 2;
  // A new command may be tried against the SAME allocator. No failover authority.
  bool retryable = 3;
}

// One explicit request authorizes at most max_bytes bytes from one stream.
message ExecutionLogsRequest {
  string execution_id = 1;
  string stream = 2;
  uint64 offset = 3;
  uint32 max_bytes = 4;
}

message ExecutionLogsResponse {
  string execution_id = 1;
  string stream = 2;
  uint64 offset = 3;
  bytes data = 4;
  uint64 next_offset = 5;
  bool eof = 6;
  bool truncated = 7;
  bytes sha256 = 8;
}

// ExecutionLeaseRenew renews the client-held lease that bounds an execution's
// lifetime. It is authenticated against the execution owner, idempotent under
// replay (the same message ID returns the same ack without mutation), and
// carries no payload beyond the requested lease duration: renewal never
// attaches logs, results, or other data. The allocator bounds the accepted
// duration locally.
message ExecutionLeaseRenew {
  string execution_id = 1;
  google.protobuf.Duration lease_duration = 2;
}

// ExecutionLeaseRenewAck carries only the new lease expiry.
message ExecutionLeaseRenewAck {
  string execution_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// ExecutionTunnelGrant requests a short-lived, single-use, execution-scoped
// direct-access tunnel to a running execution. The sender must be the
// authenticated execution owner. ygg_peer_pubkey is the client's edge node
// public key (HKDF-derived from the client identity seed, opaque to the
// protocol); the allocator binds it into the minted grant so the tunnel edge
// accepts only an authenticated peer whose key matches.
message ExecutionTunnelGrant {
  string execution_id = 1;
  bytes ygg_peer_pubkey = 2;
}

// ExecutionTunnelGrantAck is the allocator's mint reply: a grant ID, its
// expiry, and the transport-neutral allocator-local endpoint advertisement
// (opaque address bytes and opaque public-key bytes). Nothing secret is
// embedded in the advertisement or the ack.
message ExecutionTunnelGrantAck {
  string execution_id = 1;
  string grant_id = 2;
  google.protobuf.Timestamp expires_at = 3;
  bytes allocator_endpoint = 4;
  bytes allocator_endpoint_pubkey = 5;
}
