syntax = "proto3";

package r1s.v1;

option go_package = "github.com/mytecor/r1s/api/gen/r1s/v1;r1sv1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Envelope is the authenticated unit exchanged by transports. Transports MUST
// replace sender with the identity authenticated for the connection.
message Envelope {
  string message_id = 1;
  bytes sender = 2;
  string correlation_id = 3;
  google.protobuf.Timestamp sent_at = 4;

  reserved 5 to 9;
  // 23/24 were the retired ExecutionTunnelGrant/ExecutionTunnelGrantAck oneof
  // payloads; their names and numbers are reserved and never reused (F22-06).
  reserved 23, 24;
  reserved "execution_tunnel_grant", "execution_tunnel_grant_ack";

  oneof payload {
    ExecutionRequest execution_request = 10;
    ExecutionOffer execution_offer = 11;
    ExecutionAssign execution_assign = 12;
    ExecutionCancel execution_cancel = 13;
    ExecutionState execution_state = 14;
    ExecutionInspect execution_inspect = 15;
    ExecutionOfferRelease execution_offer_release = 16;
    ExecutionOfferReleaseAck execution_offer_release_ack = 17;
    CommandError command_error = 18;
    ExecutionLogsRequest execution_logs_request = 19;
    ExecutionLogsResponse execution_logs_response = 20;
    ExecutionLeaseRenew execution_lease_renew = 21;
    ExecutionLeaseRenewAck execution_lease_renew_ack = 22;
    ExecutionTunnelOpen execution_tunnel_open = 25;
    ExecutionTunnelOpenAck execution_tunnel_open_ack = 26;
  }
}

// Workload describes an OCI workload without exposing a concrete runtime API.
message Workload {
  string image = 1;
  repeated string command = 2;
  repeated string args = 3;
  map<string, string> environment = 4;
  string working_directory = 5;
}

// ExecutionPolicy bounds an execution independently of network connectivity.
// Lifetime is bounded by a durable, explicitly renewed client-held lease
// (see ExecutionLeaseRenew), never by a request-time deadline: `deadline` and
// `max_runtime` are retired and their field numbers are reserved, never reused.
// `result_retention` is unchanged.
message ExecutionPolicy {
  reserved 1, 2;
  reserved "deadline", "max_runtime";

  google.protobuf.Duration result_retention = 3;
}

// NodeCapabilities is the allocator's normalized, bounded description of what
// its node can run. Identity strings are lowercase ASCII with bounded lengths;
// devices, labels, profiles, and image-cache entries are bounded in count and
// size. The message rides allocator offers (authoritative at assignment) and
// is summarized by the RNS announce descriptor, which is far more compact and
// advisory because the announce app-data budget is small (255 bytes).
// Capability metadata is a hint for client placement, never a substitute for
// allocator-local admission and runtime policy.
message NodeCapabilities {
  string os = 1;
  string arch = 2;
  string runtime = 3;
  // resource_profiles lists the admission resource classes this allocator
  // supports; the requested resource class must be one of them.
  repeated string resource_profiles = 4;
  // devices lists device names the allocator declares it can expose. The list
  // is authoritative local admission; a client constraint can only require a
  // subset of what is declared, never ask for an undeclared device.
  repeated string devices = 5;
  // labels are operator-defined node labels (for example region=eu).
  map<string, string> labels = 6;
  // cached_images is a purely advisory image-cache hint owned by the issuing
  // allocator: it never bounds or authorizes anything.
  repeated string cached_images = 7;
}

// PlacementConstraints expresses the client's exact-match node requirements.
// Every present field must equal a declared node capability: a non-empty
// os/arch/runtime must match exactly, every label key/value pair must be
// present in the node's labels, and every device must be declared by the
// allocator. An empty message matches any node that offers the requested
// resource class. The allocator applies the same predicates at request time
// (so it neither reserves capacity nor returns an offer for an incompatible
// node) and again at assignment (so a capability change since the offer is an
// explicit rejection, never an invalid start).
message PlacementConstraints {
  string os = 1;
  string arch = 2;
  string runtime = 3;
  // labels requires exact key=value matches; the node must contain every pair.
  map<string, string> labels = 4;
  // devices requires every listed device to be declared by the allocator.
  repeated string devices = 5;
}

message ExecutionRequest {
  string request_id = 1;
  Workload workload = 2;
  ExecutionPolicy policy = 3;
  string resource_class = 4;
  // constraints narrows which allocators may offer. Omit for any-node requests.
  PlacementConstraints constraints = 5;
  // run_id correlates every at-least-once attempt owned by one run process.
  // It is 16 random bytes encoded as 32 lowercase hexadecimal characters and
  // grants no authority; transports authenticate the owner independently.
  string run_id = 6;
  // attempt starts at one and increases for each newly announced execution.
  uint64 attempt = 7;
}

message ExecutionOffer {
  string offer_id = 1;
  string request_id = 2;
  string resource_class = 3;
  google.protobuf.Timestamp expires_at = 4;
  // node is the issuing allocator's bounded capability metadata, captured at
  // offer time so the client can rank offers without another round trip.
  NodeCapabilities node = 5;
}

message ExecutionAssign {
  string request_id = 1;
  string offer_id = 2;
  string execution_id = 3;
}

// Release only gives back a reservation owned by the authenticated client.
// It never cancels an assigned execution.
message ExecutionOfferRelease {
  string request_id = 1;
  string offer_id = 2;
}

message ExecutionOfferReleaseAck {
  string request_id = 1;
  string offer_id = 2;
  OfferReleaseOutcome outcome = 3;
}

enum OfferReleaseOutcome {
  OFFER_RELEASE_OUTCOME_UNSPECIFIED = 0;
  OFFER_RELEASE_OUTCOME_RELEASED = 1;
  OFFER_RELEASE_OUTCOME_EXPIRED = 2;
  OFFER_RELEASE_OUTCOME_ASSIGNED = 3;
}

message ExecutionCancel {
  string execution_id = 1;
  string reason = 2;
}

// ExecutionInspect asks the selected allocator for its latest durable state.
// It is safe to repeat after either participant restarts.
message ExecutionInspect {
  string execution_id = 1;
}

enum ExecutionPhase {
  EXECUTION_PHASE_UNSPECIFIED = 0;
  EXECUTION_PHASE_STARTING = 1;
  EXECUTION_PHASE_RUNNING = 2;
  EXECUTION_PHASE_CANCELLING = 3;
  EXECUTION_PHASE_CANCELLED = 4;
  EXECUTION_PHASE_COMPLETED = 5;
  EXECUTION_PHASE_FAILED = 6;
}

message ExecutionState {
  string execution_id = 1;
  ExecutionPhase phase = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string detail = 4;
  optional int32 exit_code = 5;
  // Zero denotes a legacy peer; positive revisions order durable transitions.
  uint64 revision = 6;
}

// Errors contain bounded service diagnostics, never workload output.
message CommandError {
  string code = 1;
  string detail = 2;
  // A new command may be tried against the SAME allocator. No failover authority.
  bool retryable = 3;
}

// One explicit request authorizes at most max_bytes bytes from one stream.
message ExecutionLogsRequest {
  string execution_id = 1;
  string stream = 2;
  uint64 offset = 3;
  uint32 max_bytes = 4;
}

message ExecutionLogsResponse {
  string execution_id = 1;
  string stream = 2;
  uint64 offset = 3;
  bytes data = 4;
  uint64 next_offset = 5;
  bool eof = 6;
  bool truncated = 7;
  bytes sha256 = 8;
}

// ExecutionLeaseRenew renews the client-held lease that bounds an execution's
// lifetime. It is authenticated against the execution owner, idempotent under
// replay (the same message ID returns the same ack without mutation), and
// carries no payload beyond the requested lease duration: renewal never
// attaches logs, results, or other data. The allocator bounds the accepted
// duration locally.
message ExecutionLeaseRenew {
  string execution_id = 1;
  google.protobuf.Duration lease_duration = 2;
}

// ExecutionLeaseRenewAck carries only the new lease expiry.
message ExecutionLeaseRenewAck {
  string execution_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// TunnelTarget is one client-owned container-side destination port the
// allocator edge splices a tunnel stream to. The r1s client supplies its
// destination ports in the tunnel grant request; the allocator validates only
// their shape, binds the supplied ports into the minted grant unchanged, and
// proxies/splices each stream to the port the client named (resolved on the
// allocator loopback, 127.0.0.1:<port>). The client binds its own local
// listener and names the container port in each stream-open. The allocator
// never reads a destination from its own configuration at grant time.
message TunnelTarget {
  // port is the container-side destination port the allocator splices a stream
  // to. Zero is invalid; a grant must carry at least one target. There are no
  // named slots: each target is just the port to export.
  uint32 port = 3;
}

// ExecutionTunnelOpen declares the owned run's tunnel binding. It replaces the
// retired ExecutionTunnelGrant (field numbers 23/24 reserved above): there is
// no short-lived grant token, no grant ID, and no TTL. The transport-verified
// sender IS the authenticated execution owner (the Envelope sender is replaced
// by the transport from the authenticated connection, never trusted from a
// payload), and the allocator binds the declared edge node public key and
// container-port list to the execution for the execution's lifetime. A tunnel
// peer that later presents the bound edge key to a running execution is
// authorized directly and spliced; there is no single-use consumption to
// waste. After an allocator restart the in-memory binding is gone and a fresh
// authenticated open is required before any stream may be established.
message ExecutionTunnelOpen {
  string execution_id = 1;
  // ygg_peer_pubkey is the client edge node public key (HKDF-derived from the
  // run identity seed, opaque to the protocol) the allocator binds to the
  // execution. A tunnel connection presenting this authenticated peer key is
  // authorized; any other key fails closed. It is not a bearer secret: it only
  // binds the mesh-authenticated peer, and the client holding the private key
  // is what proves ownership of the key.
  bytes ygg_peer_pubkey = 2;
  // targets is the client-supplied destination container port list bound to the
  // execution; at least one target (a positive container port) is required.
  repeated TunnelTarget targets = 3;
}

// ExecutionTunnelOpenAck is the allocator's reply to ExecutionTunnelOpen: the
// transport-neutral allocator-local endpoint advertisement (opaque address
// bytes and opaque public-key bytes) and the echoed client-supplied container
// port list so the client and edge agree on the resolved ports. There is no
// grant ID and no expiry: the binding lives for the execution's lifetime. On a
// re-open for the same execution the allocator replaces the binding (repinning
// the peer key and target list) so a reconnected run re-establishes cleanly.
message ExecutionTunnelOpenAck {
  string execution_id = 1;
  bytes allocator_endpoint = 2;
  bytes allocator_endpoint_pubkey = 3;
  repeated TunnelTarget targets = 4;
}

// ============================================================================
// Tunnel Open protocol (F21-02). The control plane advertises the minimum
// needed to create a private tunnel RNS transport, and the first application
// message on an identified tunnel Link is an explicit Open, replacing the
// minted-grant flow.
//
// These messages are the first application bytes on the tunnel LINK (a private
// RNS data plane), never an Envelope: tunnel data never crosses the control
// plane. They are defined here so the protocol, allocator edge, and client edge
// share one wire contract.
// ============================================================================

// TunnelOpen is the first application message a client sends on an established,
// identified tunnel Link. It names the execution and the container-side
// destination port the stream is spliced to. The allocator responds with
// TunnelOpenResult: OK begins the byte stream, or a classified error.
message TunnelOpen {
  string execution_id = 1;
  // target_port is the container-side destination port the stream is spliced
  // to inside the execution. Zero is invalid.
  uint32 target_port = 2;
}

// TunnelOpenError classifies why an Open was rejected. The value mirrors
// LocalTunnelClose.Reason and the tunnel package's classified teardown reasons,
// so the client edge and CLI surface one consistent diagnostic.
enum TunnelOpenError {
  TUNNEL_OPEN_ERROR_UNSPECIFIED = 0;
  TUNNEL_OPEN_ERROR_UNAUTHORIZED = 1;
  TUNNEL_OPEN_ERROR_NOT_RUNNING = 2;
  TUNNEL_OPEN_ERROR_INVALID_PORT = 3;
  TUNNEL_OPEN_ERROR_NO_ENDPOINT = 4;
  TUNNEL_OPEN_ERROR_MESH_UNREACHABLE = 5;
}

// TunnelOpenResult is the allocator's reply to TunnelOpen. ok=true begins the
// byte stream; otherwise error carries a classified rejection.
message TunnelOpenResult {
  bool ok = 1;
  TunnelOpenError error = 2;
  string detail = 3;
}
